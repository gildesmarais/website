name: CI
on:
  push:
    branches: [master]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - run: make lint-prettier
      - run: make lint-css
      - run: npm test
      - run: npm run build
      - run: npm run check:visual
      - run: npm run check:dist
      - run: make lint-xml
      - run: npx astro check
