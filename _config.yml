# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Gil Desmarais
subheadline: I'm a full stack developer from Berlin.

email: your-email@domain.com
description: A fullstack developer, focusing on web development, living in Berlin, working worldwide.
baseurl: ""
url: "https://gil.desmarais.de"

author: Gil Desmarais
github_username: gildesmarais
linkedin_username: gildesmarais
twitter:
  username: gldsmrs
  card: summary

# Build settings
markdown: kramdown
theme:

permalink: /posts/:title

plugins:
  - jekyll-archives
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-target-blank
  - jekyll-toc
  - jekyll-seo-tag
  - jekyll-loading-lazy
  - jekyll-pwa-plugin

jekyll-archives:
  enabled:
    - tags
  layout: archive
  permalinks:
    # year: '/:year/'
    # month: '/:year/:month/'
    # day: '/:year/:month/:day/'
    tag: "/tag/:name/"
    category: "/category/:name/"

pwa:
  # enabled: false # Optional
  # sw_src_filepath: service-worker.js # Optional
  # sw_dest_filename: service-worker.js # Optional
  dest_js_directory: assets/javascript # Required
  precache_recent_posts_num: 15 # Optional
  # precache_glob_directory: / # Optional
  precache_glob_patterns: # Optional
    - "assets/**/*.{js,css,eot,svg,ttf,woff,woff2}"
    - index.html
    - manifest.json
    - "{contact,help,projects,resume,tag}/*.html"
  # precache_glob_ignores: # Optional
  # - sw-register.js
  # - "fonts/**/*"

exclude:
  - .git/
  - .github/
  - .gitignore
  - .jekyll-cache
  - .nvmrc
  - .ruby-version
  - .sass-cache
  - .stylelintrc.json
  - Gemfile
  - Gemfile.lock
  - Makefile
  - node_modules/
  - package.json
  - vendor
  - yarn.error
  - yarn.lock

sass:
  style: compressed
  sass_dir: assets/css/sass
