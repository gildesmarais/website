permalink: /tag/
noindex: true

---

<h1>All Tags</h1>

<ul class="tags">
  {% for tag in site.tags %}
    {% assign t = tag | first %}
    {% assign clean = t | downcase | replace:" ","-" %}
    <li class="tags__tag">
      <a href="/tag/{{ t }}">{{ clean }}</a>
    </li>
  {% endfor %}
</ul>
