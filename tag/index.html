<h1>All Tags</h1>

{% for tag in site.tags %}
  {% assign t = tag | first %}
  {% assign clean = t | downcase | replace:" ","-" %}
  <p>
    <a class="tags__tag" href="/tag/{{ t }}">{{ clean }}</a>
  </p>
{% endfor %}
