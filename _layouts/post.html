---
layout: default
---

<main class="container">
  <article class="post">
    <header class="post__header">
      <p class="post__meta">
        <time
          datetime="{{ page.date | date_to_xmlschema }}"
        >
          {{ page.date | date_to_long_string }}
        </time>
      </p>
      <h1 class="post__title">
        {{ page.title | escape }}
      </h1>
    </header>

    <div class="post__content">
      {% if page.toc %}
        <p class="is-alternative-font">{{ page.description }}</p>
      {% endif %}

      {{ content | toc }}
    </div>

    <aside>
      <a
        class="post__footer-note"
        role="complementary"
        href="{{ '/feed.xml' | relative_url }}"
      >
        If you don’t want to miss any of my rare posts, I suggest
        <span>subscribing to the RSS feed</span>.
      </a>
    </aside>
  </article>
</main>
