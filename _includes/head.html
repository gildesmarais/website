<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=EDGE" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="referrer" content="no-referrer" />
  <meta
    name="robots"
    content="{% if page.noindex %}noindex, noarchive, follow{% else %}index, follow{% endif %}"
  />

  <link rel="manifest" href="/manifest.json" />
  <link
    as="font"
    crossorigin
    href="/assets/css/fonts/Jura/Jura-Light.woff2"
    rel="preload"
    type="font/woff2"
  />
  <link
    as="font"
    crossorigin
    href="/assets/css/fonts/Jura/Jura-Light.ttf"
    rel="preload"
    type="font/ttf"
  />
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?{% cachebuster %}" />
  <link
    rel="stylesheet"
    href="{{ '/assets/css/print.css' | relative_url }}?{% cachebuster %}"
    media="print"
  />

  {% feed_meta %}
  {% include favicons.html %}

  {% seo %}
</head>
