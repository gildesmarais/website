<head>
  <meta http-equiv="X-UA-Compatible" content="IE=EDGE" />
  <meta charset="utf-8">
  <title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}">
  <meta name="robots" content="{% if page.noindex %}noindex, follow{% else %}index, follow{% endif %}" />

  {% asset "main.css" %}

  <link rel="canonical" href="{{ page.url | replace: 'index.html','' | absolute_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title | escape }}" href="{{ "/feed.xml" | relative_url }}">

  <link rel="apple-touch-icon" sizes="57x57"   href="{% asset "apple-touch-icon-57x57.png" @path %}">
  <link rel="apple-touch-icon" sizes="60x60"   href="{% asset "apple-touch-icon-60x60.png" @path %}">
  <link rel="apple-touch-icon" sizes="72x72"   href="{% asset "apple-touch-icon-72x72.png" @path %}">
  <link rel="apple-touch-icon" sizes="76x76"   href="{% asset "apple-touch-icon-76x76.png" @path %}">
  <link rel="apple-touch-icon" sizes="114x114" href="{% asset "apple-touch-icon-114x114.png" @path %}">
  <link rel="apple-touch-icon" sizes="120x120" href="{% asset "apple-touch-icon-120x120.png" @path %}">
  <link rel="apple-touch-icon" sizes="144x144" href="{% asset "apple-touch-icon-144x144.png" @path %}">
  <link rel="apple-touch-icon" sizes="152x152" href="{% asset "apple-touch-icon-152x152.png" @path %}">
  <link rel="apple-touch-icon" sizes="180x180" href="{% asset "apple-touch-icon-180x180.png" @path %}">
  <link rel="icon" type="image/png" sizes="32x32"   href="{% asset "favicon-32x32.png" @path %}">
  <link rel="icon" type="image/png" sizes="192x192" href="{% asset "android-chrome-192x192.png" @path %}">
  <link rel="icon" type="image/png" sizes="96x96"   href="{% asset "favicon-96x96.png" @path %}">
  <link rel="icon" type="image/png" sizes="16x16"   href="{% asset "favicon-16x16.png" @path %}">
  <meta name="msapplication-TileColor" content="#ffffff">
  <meta name="msapplication-TileImage" content="{% asset "mstile-144x144.png" @path %}">
  <meta name="theme-color" content="#ffffff">
  <link rel="prefetch" href="/about">
  <link rel="prefetch" href="/about/experiences/">
  <link rel="prefetch" href="/contact/">
</head>
