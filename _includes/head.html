<head>
  <meta http-equiv="X-UA-Compatible" content="IE=EDGE" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <meta
    name="robots"
    content="{% if page.noindex %}noindex, noarchive, follow{% else %}index, follow{% endif %}"
  />

  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />
  <link
    rel="canonical"
    href="{{ page.url | replace: 'index.html','' | absolute_url }}"
  />
  <link
    rel="alternate"
    type="application/rss+xml"
    title="{{ site.title | escape }}"
    href="{{ "/feed.xml" | relative_url }}"
  />

  <link rel="prefetch" href="/" />
  <link rel="prefetch" href="/blog" />
  <link rel="prefetch" href="/projects" />
  <link rel="prefetch" href="/resume" />

  {% include favicons.html %}

  {% seo %}

  {% if page.seo.image %}
  <meta property="og:image" content="{{ page.seo.image | absolute_url }}" />
  {% else %}
  <meta property="og:image" content="{{ "/assets/images/social.png" | absolute_url }}" />
  {% endif %}
</head>
