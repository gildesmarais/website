<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=EDGE" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="referrer" content="no-referrer" />
  <meta
    name="robots"
    content="{% if page.noindex %}noindex, noarchive, follow{% else %}index, follow{% endif %}"
  />

  <link rel="manifest" href="/manifest.json" />
  <style type="text/css">
    {% capture critical %}
      {% include critical.scss %}
    {% endcapture %}
    {{ critical | scssify }}
  </style>

  <link rel="preload" href="{{ '/assets/css/main.css' | relative_url }}?{% cachebuster %}"
        as="style">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?{% cachebuster %}"
        onload="this.onload=null;this.media='screen'" media="async">
  <noscript>
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?{% cachebuster %}">
  </noscript>


  <link
    rel="stylesheet"
    href="{{ '/assets/css/print.css' | relative_url }}?{% cachebuster %}"
    media="print"
  />

  {% feed_meta %}
  {% include favicons.html %}

  {% seo %}
</head>
