<footer class="section">
  <div class="container">
    <a href="{{ "/contact" | relative_url }}" class="footer__link {% if current[1] == 'contact' %}footer__link--active{% endif %} ">
      <span data-mousetrap>C</span>ontact
    </a>
    <a href="{{ "/privacy" | relative_url }}" class="footer__link {% if current[1] == 'privacy' %}footer__link--active{% endif %} ">
      Privacy
    </a>

    <div class="footer__links">
      <a
        class="footer__link"
        href="{{ "/feed.xml" | relative_url }}"
      >
        RSS
      </a>
      <a
        class="footer__link"
        href="https://github.com/{{ site.github_username }}"
        target="_blank"
        nofollow
        rel="noopener me"
      >
        Github
      </a>
      <a
        class="footer__link"
        href="https://linkedin.com/in/{{ site.linkedin_username }}"
        target="_blank"
        nofollow
        rel="noopener me"
      >
        LinkedIn
      </a>
    </div>
  </div>
</footer>
