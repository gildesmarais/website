<nav class="navigation">
  <header class="navigation__container" role="navigation">
    {% assign current = page.url | downcase | split: '/' %}

    <a href="{{ "/" | relative_url }}" class="navigation__logo {% if current[1] == null %}navigation__logo--active{% endif %}">
      {% include gil.svg %}
    </a>

    <a href="{{ "/projects" | relative_url }}" class="navigation__item {% if current[1] == 'projects' %}navigation__item--active{% endif %} {% if current[1] == 'posts' %}navigation__item--active{% endif %}">Projects</a>
    <a href="{{ "/resume" | relative_url }}" class="navigation__item {% if current[1] == 'resume' %}navigation__item--active{% endif %} ">Résumé</a>
    <a href="{{ "/blog" | relative_url }}" class="navigation__item {% if current[1] == 'blog' %}navigation__item--active{% endif %} {% if current[1] == 'posts' %}navigation__item--active{% endif %}">Blog</a>
    <a href="{{ "/contact" | relative_url }}" class="navigation__item {% if current[1] == 'contact' %}navigation__item--active{% endif %} ">Contact</a>
  </header>
</nav>
