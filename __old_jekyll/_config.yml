# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
encoding: UTF-8
title: Gil Desmarais
subheadline: I'm a full stack developer from Berlin.

email: your-email@domain.com
description: A fullstack developer, focusing on web development, living in Berlin, working worldwide.
baseurl: ""
url: "https://gil.desmarais.de"

author: Gil Desmarais
github_profile_url: https://github.com/gildesmarais/
mastodon_profile_url: https://social.tchncs.de/@gil

# Build settings
markdown: kramdown
theme:

permalink: /posts/:title/

plugins:
  - jekyll-archives
  - jekyll-sitemap
  - jekyll-link-attributes
  - jekyll-toc
  - jekyll-seo-tag
  - jekyll-loading-lazy

jekyll-archives:
  enabled:
    - tags
  layout: archive
  permalinks:
    # year: '/:year/'
    # month: '/:year/:month/'
    # day: '/:year/:month/:day/'
    tag: "/tag/:name/"
    category: "/category/:name/"

external_links:
  enabled: true
  rel: external nofollow noopener
  target: _blank

feed:
  posts_limit: 10
  excerpt_only: true
  disable_in_development: true

collections:
  fleamarket:
    output: true
    sort_by: sort_criteria

defaults:
  - scope:
      path: "googleeaa7abda502171a*.html"
    values:
      sitemap: false

exclude:
  - .git/
  - .github/
  - .gitignore
  - .jekyll-cache
  - .nvmrc
  - .prettierignore
  - .ruby-version
  - .sass-cache
  - bin/
  - Gemfile
  - Gemfile.lock
  - Makefile
  - node_modules
  - package.json
  - README.md
  - vendor
  - yarn.error
  - yarn.lock

include:
  - googleeaa7abda502171aa.html
  - .htaccess

sass:
  style: compressed
  sass_dir: assets/css/sass

ratings:
  chars:
    [
      "0‒9",
      "a",
      "b",
      "c",
      "d",
      "e",
      "f",
      "g",
      "h",
      "i",
      "j",
      "k",
      "l",
      "m",
      "n",
      "o",
      "p",
      "q",
      "r",
      "s",
      "t",
      "u",
      "v",
      "w",
      "xyz",
    ]
